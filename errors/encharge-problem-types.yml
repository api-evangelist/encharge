  note: >-
    Encharge publishes NO error-code reference. The 69 operations in the
    published OpenAPI declare ONLY success responses (200/201/204) — not one
    4xx or 5xx response is described anywhere in the spec, so an agent has no
    machine-readable failure contract. The only error documentation Encharge
    publishes is the envelope shape and a single worked 400 example on the
    Transactional Email API pages, captured below.
envelope:
  wrapper: error
  fields:
    - {name: message, type: string, description: Human-readable error message}

aid: encharge
name: Encharge
description: >-
  Encharge is a behavior-based marketing automation platform built for SaaS
  companies, with a visual flow builder, broadcasts, segments, lead scoring,
  A/B testing, native forms, custom objects, and 50+ native integrations
  (HubSpot, Stripe, Salesforce, Segment, Facebook Ads, and more). The platform
  combines email marketing automation, user profiles, and product-event tracking
  to send targeted emails based on what users do (or do not do) in a SaaS
  product. Encharge exposes three developer surfaces: a REST API of 69
  operations covering people, person fields, segments, tags, broadcasts, email
  templates, sending domains, custom objects and event subscriptions, described
  by a published OpenAPI 3.0 definition; a prose-documented Transactional Email
  API; and an Ingest API for streaming people and product events from a backend.
  All three authenticate with the same account token, passed in the
  X-Encharge-Token header or a token query parameter, with OAuth 2 available for
  partner apps.
type: Index

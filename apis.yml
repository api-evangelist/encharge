- aid: encharge:ingest-api
  name: Encharge Ingest API
  description: >-
    Single-endpoint Ingest API for creating/updating people and submitting product
    events into Encharge from an application backend. POSTs JSON to
    https://ingest.encharge.io/v1/ with the account write key, and supports the
    special alias (re-key a person) and group (create/update a custom object)
    event types. Documented in prose only — no machine-readable definition.
  humanURL: https://docs.encharge.io/getting-started/connecting-your-app-to-encharge/ingest-api
  baseURL: https://ingest.encharge.io/v1

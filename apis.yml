- aid: encharge:transactional-email-api
  name: Encharge Transactional Email API
  description: >-
    REST API for sending transactional emails through Encharge. Accepts JSON at
    POST /v1/emails/send with exactly one of template, html or text, returns 202
    Accepted, and authenticates via the same account token used by the core REST
    API. Included with the Premium plan. Documented in prose only — this endpoint
    is not part of Encharge's published OpenAPI.
  humanURL: https://docs.encharge.io/transactional-email-api/overview

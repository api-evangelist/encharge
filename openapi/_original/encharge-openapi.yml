    SegmentCondition:
      allOf: [{anyOf: [{$ref: '#/components/schemas/SegmentEventCondition'}, {$ref: '#/components/schemas/SegmentTagCondition'}, {$ref: '#/components/schemas/SegmentPropertyCondition'}, {$ref: '#/components/schemas/SegmentNestedSegmentCondition'}, {$ref: '#/components/schemas/SegmentConditionGroup'}, {$ref: '#/components/schemas/SegmentAssociationCondition'}, {$ref: '#/components/schemas/SegmentGoalCondition'}]}, {properties: {uuid: {type: string}}, type: object}]
    Segment:

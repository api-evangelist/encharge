    Partial_Omit_ISegment.id-or-accountId-or-version__:
      properties: {name: {type: string, description: 'Name of the segment'}, objectName: {type: string, description: 'Type of object this segment is for'}, conditions: {$ref: '#/components/schemas/SegmentConditionGroup', description: 'Segment conditions'}, readOnly: {type: boolean, description: 'Readonly segments cannot be modified. They are created by the system'}, autoSegment: {type: boolean, description: Internal.}, color: {type: string, description: 'Hex color associated with the segment'}, templateId: {type: string, description: 'Name of the template this segment is based on'}}
      type: object
      description: 'Make all properties in T optional'
    SegmentCreatable:
      $ref: '#/components/schemas/Partial_Omit_ISegment.id-or-accountId-or-version__'
    Partial_ISegment_:
      properties: {version: {type: number, enum: [1, 2], description: 'Segment version. Should be 2 for non-legacy segments'}, id: {type: number, format: double, description: 'Id of the segment'}, name: {type: string, description: 'Name of the segment'}, objectName: {type: string, description: 'Type of object this segment is for'}, conditions: {$ref: '#/components/schemas/SegmentConditionGroup', description: 'Segment conditions'}, accountId: {type: number, format: double, description: 'Account that owns the segment'}, readOnly: {type: boolean, description: 'Readonly segments cannot be modified. They are created by the system'}, autoSegment: {type: boolean, description: Internal.}, color: {type: string, description: 'Hex color associated with the segment'}, templateId: {type: string, description: 'Name of the template this segment is based on'}}
      type: object
      description: 'Make all properties in T optional'
    EndUserIdentifiers:
      properties: {id: {type: string, description: "Encharge ID of the person. An UUID.\n\nAt least one of id/userId/email must be specified."}, userId: {type: string, description: "UserID of the person.\n\nAt least one of id/userId/email must be specified."}, email: {type: string, description: "Email of the person.\n\nAt least one of id/userId/email must be specified."}}
      additionalProperties: {}
